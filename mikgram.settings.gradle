// MikGram: the phone is arm64, so the native code of the library module is not built for the
// other three ABIs. Done here because an app module cannot configure a sibling once evaluated.
gradle.beforeProject { project ->
    if (project.path == ':TMessagesProj') {
        project.plugins.withId('com.android.library') {
            project.android.defaultConfig.ndk.abiFilters 'arm64-v8a'
        }
    }
}
